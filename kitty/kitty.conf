# kitty skonfigurowany tak, żeby wyglądał jak Ptyxis (domyślny terminal GNOME)

# --- Przewijanie ---
# Mniejsza wartość = wolniejsze przewijanie touchpadem
touch_scroll_multiplier 1.0
momentum_scroll 0.98
scrollback_lines 10000

# --- Pamiętanie kart ---
# session_saver.py zapisuje karty i okna (z katalogami roboczymi) przy każdej zmianie,
# a przy starcie kitty je przywraca. `kitty --session=none` uruchamia czystą sesję.
watcher session_saver.py
startup_session ~/.local/state/kitty/last-session.kitty-session

# --- Czcionka (jak w Ptyxis: MonaspiceNe NFM 12, wysokość komórki 1.1) ---
font_family      MonaspiceNe NFM
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
modify_font      cell_height 110%

# --- Okno ---
initial_window_width  121c
initial_window_height 43c
remember_window_size  yes
window_padding_width  6
hide_window_decorations no
wayland_titlebar_color background
confirm_os_window_close 1

# --- Kursor ---
cursor_shape block
cursor_blink_interval -1

# --- Dzwonek (Ptyxis: dźwiękowy + wizualny) ---
enable_audio_bell yes
visual_bell_duration 0.15

# --- Karty u góry, wyśrodkowane jak w GNOME ---
tab_bar_edge          top
tab_bar_style         separator
tab_separator         ""
tab_bar_align         center
tab_bar_min_tabs      1
tab_bar_margin_height 4.0 4.0
tab_title_template    "   {fmt.fg.red}{bell_symbol}{fmt.fg.tab}{title}   "
active_tab_font_style   normal
inactive_tab_font_style normal
active_tab_foreground   #f8f8f2
active_tab_background   #44475a
inactive_tab_foreground #bfbfbf
inactive_tab_background #21222c
tab_bar_background      #21222c

# --- Skróty jak w Ptyxis ---
map ctrl+page_up   previous_tab
map ctrl+page_down next_tab
map ctrl+shift+page_up   move_tab_backward
map ctrl+shift+page_down move_tab_forward
map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

# --- Paleta Dracula (wyciągnięta z Ptyxis, wariant ciemny) ---
foreground           #f8f8f2
background           #282a36
cursor               #f8f8f2
cursor_text_color    #282a36
selection_foreground #f8f8f2
selection_background #44475a
url_color            #8be9fd

